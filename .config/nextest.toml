# Postgres-backed tests do `CREATE SCHEMA IF NOT EXISTS`. serial_test's
# #[serial] only serializes within a single process, but nextest runs each
# test in its own process and can run tests from multiple crates at once —
# so concurrent CREATE SCHEMA across processes races (duplicate-key). Cap the
# group to one thread so at most one DB test runs at a time, workspace-wide.
# (This is the isolation that reverted nextest in #77; do not remove it.)
[test-groups]
serial-db = { max-threads = 1 }

[[profile.default.overrides]]
# All harness-persist tests (the #[serial_test::serial] DB tests) + harness-core's
# db_pg_tests module (uses an in-process process_env_lock() that does NOT help
# across nextest processes). Both packages create schemas; serialize them together.
filter = 'package(harness-persist) | (package(harness-core) & test(db_pg))'
test-group = 'serial-db'
