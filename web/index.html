<!doctype html>
<html lang="en" class="h-full antialiased">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>harness</title>
    <link rel="icon" href="/favicon.ico" />
    <!--
      Apply the stored theme before anything paints. React setting the class on
      mount is too late: the page renders in one theme and visibly repaints into
      the other. Duplicates the key and rule in `src/lib/theme.ts` by necessity —
      this has to run before any module loads.
    -->
    <script>
      (function () {
        try {
          var stored = localStorage.getItem("harness.theme");
          var dark =
            stored === "dark" ||
            (stored !== "light" &&
              window.matchMedia("(prefers-color-scheme: dark)").matches);
          document.documentElement.classList.toggle("dark", dark);
        } catch (e) {
          // Unreadable storage (private window, site data blocked): fall back to
          // the OS, and to dark if even that cannot be asked.
          document.documentElement.classList.add("dark");
        }
      })();
    </script>
  </head>
  <body class="h-full overflow-hidden">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
