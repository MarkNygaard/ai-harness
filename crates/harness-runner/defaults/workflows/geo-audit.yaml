name: geo-audit
description: |
  Audit a project's live site for GEO (Generative Engine Optimization) — how
  ready the page is to be CITED by AI search engines (ChatGPT, Claude,
  Perplexity, Gemini, Google AI Overviews), with traditional SEO as the
  supporting foundation.

  Runs against the project's `external_url` (set it on the Projects page; it's
  exposed as `$EXTERNAL_URL`). A `discover` step fetches the page + robots.txt +
  llms.txt / llms-full.txt + sitemap.xml + headers (deliberately WITHOUT
  JavaScript — that's what an AI crawler sees); four analysis steps then score
  dimensions in parallel — **technical**, **crawlers** (access + llms.txt +
  sitemap), **schema**, **content** — and a `synthesize` step combines them
  into a 0–100 composite, writes `geo-report.md`, and emits the structured
  verdict (severity-tagged findings whose `fix` is phrased for `idea-to-pr`).

  NOT for: code changes (it only reads), or sites without an `external_url`.

provider: claude
model: opus
nodes:
  - id: discover
    category: setup
    bash: |
      set -uo pipefail
      url="$EXTERNAL_URL"
      if [ -z "${url}" ]; then
        echo "No external_url for this project — set it on the Projects page." >&2
        exit 1
      fi
      mkdir -p "$ARTIFACTS_DIR"
      root="$(printf '%s' "$url" | sed -E 's#(https?://[^/]+).*#\1#')"
      echo "Auditing $url (root $root)"
      # Raw homepage HTML with a browser UA — preserves <head> and is NOT
      # JS-rendered, matching what an AI crawler actually sees.
      curl -fsSL --max-time 30 -A "Mozilla/5.0 (compatible; harness-geo-audit)" \
        "$url" -o "$ARTIFACTS_DIR/page.html" || echo "(homepage fetch failed)"
      # robots.txt — AI-crawler access rules.
      curl -fsSL --max-time 15 "$root/robots.txt" \
        -o "$ARTIFACTS_DIR/robots.txt" || echo "(no robots.txt)"
      # llms.txt / llms-full.txt — the emerging AI-guidance standard. A strong
      # GEO signal and an easy fix (just add the file). -f → no output on 404.
      curl -fsSL --max-time 15 "$root/llms.txt" \
        -o "$ARTIFACTS_DIR/llms.txt" || echo "(no llms.txt)"
      curl -fsSL --max-time 15 "$root/llms-full.txt" \
        -o "$ARTIFACTS_DIR/llms-full.txt" || echo "(no llms-full.txt)"
      # sitemap.xml — page discovery for crawlers (robots.txt may also point to
      # one via a Sitemap: line, which the crawlers step checks).
      curl -fsSL --max-time 15 "$root/sitemap.xml" \
        -o "$ARTIFACTS_DIR/sitemap.xml" || echo "(no sitemap.xml)"
      # Status as an AI bot vs a browser — a 403 for the bot but 200 for the
      # browser = AI crawlers silently blocked.
      curl -sS -o /dev/null -D "$ARTIFACTS_DIR/headers-gptbot.txt" \
        -w "gptbot_status=%{http_code}\n" --max-time 20 \
        -A "Mozilla/5.0 (compatible; GPTBot/1.0; +https://openai.com/gptbot)" "$url" || true
      curl -sS -o /dev/null -D "$ARTIFACTS_DIR/headers-browser.txt" \
        -w "browser_status=%{http_code}\n" --max-time 20 -A "Mozilla/5.0" "$url" || true
      echo "page.html: $(wc -c < "$ARTIFACTS_DIR/page.html" 2>/dev/null || echo 0) bytes"
      for f in robots.txt llms.txt llms-full.txt sitemap.xml; do
        if [ -s "$ARTIFACTS_DIR/$f" ]; then
          echo "$f: present ($(wc -c < "$ARTIFACTS_DIR/$f") bytes)"
        else
          echo "$f: absent"
        fi
      done
      echo "DISCOVER-DONE"
    timeout: 120000

  - id: technical
    category: validation
    provider: claude
    model: sonnet
    context: fresh
    depends_on: [discover]
    prompt: |
      Score the **technical** GEO foundation of $EXTERNAL_URL (0–100), set
      `key` to "technical". Read `$ARTIFACTS_DIR/page.html` and the
      `headers-*.txt` files. Assess: server-rendered vs client-only (AI crawlers
      run NO JavaScript — a near-empty/CSR `<body>` is CRITICAL, it's invisible
      to them), `<title>` / meta description / canonical, Open Graph, HTTPS,
      security headers. You MAY read the project's source to point a finding at
      the file that needs changing. Emit ONLY the JSON.
    output_format: &dim_schema
      type: object
      properties:
        key:
          type: string
          description: "Dimension key (technical | crawlers | schema | content)."
        score:
          type: integer
          description: "0–100 for this dimension."
        summary:
          type: string
        findings:
          type: array
          items:
            type: object
            properties:
              severity:
                type: string
                enum: [critical, high, medium, low]
              category:
                type: string
              title:
                type: string
              detail:
                type: string
              fix:
                type: string
                description: "Concrete change, phrased as a task for idea-to-pr."
              effort:
                type: string
                enum: [quick, medium, strategic]
            required: [severity, category, title, fix]
      required: [key, score, findings]

  - id: crawlers
    category: validation
    provider: claude
    model: sonnet
    context: fresh
    depends_on: [discover]
    prompt: |
      Score **AI-crawler access & guidance** for $EXTERNAL_URL (0–100), set
      `key` to "crawlers". Read `$ARTIFACTS_DIR/robots.txt`,
      `headers-gptbot.txt` / `headers-browser.txt`, and
      `$ARTIFACTS_DIR/llms.txt`, `llms-full.txt`, `sitemap.xml`. Any of those
      files may be missing or empty — that means the resource is absent. If a
      file contains an HTML page instead of its expected format (a soft-404),
      also treat it as absent.

      Assess:
      - **robots.txt** — are the AI crawlers allowed? Check GPTBot,
        OAI-SearchBot, ChatGPT-User, ClaudeBot, anthropic-ai, PerplexityBot,
        Google-Extended, CCBot, Bytespider, Applebot-Extended, Amazonbot. A
        blanket `Disallow: /` (explicit, or inherited from `User-agent: *`) for
        a citing crawler is CRITICAL.
      - **Edge blocking** — does the bot UA get a 403/blocked status while the
        browser gets 200 (= silently blocked at the CDN/edge — CRITICAL)?
      - **llms.txt** — present and valid (markdown headings, links to key
        content)? Absent = high-severity quick win (add `/llms.txt`); present
        but malformed = medium; comprehensive plus `/llms-full.txt` = full
        marks for this part.
      - **sitemap.xml** — present, and referenced via a `Sitemap:` line in
        robots.txt? A missing sitemap, or one not referenced from robots.txt,
        is a medium finding.

      Emit ONLY the JSON.
    output_format: *dim_schema

  - id: schema
    category: validation
    provider: claude
    model: sonnet
    context: fresh
    depends_on: [discover]
    prompt: |
      Score **structured data** for $EXTERNAL_URL (0–100), set `key` to "schema".
      Read `$ARTIFACTS_DIR/page.html` and find the JSON-LD blocks
      (`<script type="application/ld+json">`). Assess presence + validity +
      usefulness of Organization, Article, Person/author, and `sameAs` links
      (Wikipedia/LinkedIn/etc.). Note deprecated types. You MAY read the source
      to point at where `<head>` / schema is rendered. Emit ONLY the JSON.
    output_format: *dim_schema

  - id: content
    category: validation
    provider: claude
    model: sonnet
    context: fresh
    depends_on: [discover]
    prompt: |
      Score **content citability** for $EXTERNAL_URL (0–100), set `key` to
      "content". Read `$ARTIFACTS_DIR/page.html` (the visible text). Assess:
      clear question-answering passages, self-contained fact-dense paragraphs an
      AI can quote, author / E-E-A-T trust signals (named author, credentials,
      about/contact, dates), and freshness. Emit ONLY the JSON.
    output_format: *dim_schema

  - id: synthesize
    category: delivery
    provider: claude
    model: opus
    effort: high
    context: fresh
    artifact: geo-report.md
    depends_on: [technical, crawlers, schema, content]
    prompt: |
      Combine the four dimension analyses of $EXTERNAL_URL into one GEO verdict.

      Dimension results (each `{ key, score, summary, findings }`):
      - technical: $technical.output
      - crawlers:  $crawlers.output
      - schema:    $schema.output
      - content:   $content.output

      Composite score (0–100) = technical×0.30 + crawlers×0.25 + schema×0.20 +
      content×0.25. Rating: 90–100 excellent · 75–89 good · 60–74 fair ·
      40–59 poor · 0–39 critical.

      Build the `categories` array from the four dimensions (key, weight, score,
      summary). Merge all findings, dedupe near-duplicates, and keep each
      finding's `fix` phrased as a standalone task for an implementer.

      Write a human-readable report to `$ARTIFACTS_DIR/geo-report.md`: executive
      summary + composite score, the per-dimension scores, findings grouped by
      severity, and a prioritized action plan (quick wins first).

      Then emit ONLY the JSON verdict matching the schema — no prose.
    output_format:
      type: object
      properties:
        score:
          type: integer
          description: "Composite GEO score, 0–100."
        rating:
          type: string
          enum: [critical, poor, fair, good, excellent]
        summary:
          type: string
          description: "2–4 sentence executive summary."
        categories:
          type: array
          items:
            type: object
            properties:
              key:
                type: string
              weight:
                type: number
              score:
                type: integer
              summary:
                type: string
            required: [key, score, summary]
        findings:
          type: array
          items:
            type: object
            properties:
              severity:
                type: string
                enum: [critical, high, medium, low]
              category:
                type: string
              title:
                type: string
              detail:
                type: string
              fix:
                type: string
                description: "The concrete change, phrased as a task for idea-to-pr."
              effort:
                type: string
                enum: [quick, medium, strategic]
            required: [severity, category, title, fix]
      required: [score, rating, summary, categories, findings]
