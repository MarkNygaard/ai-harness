name: geo-audit
description: |
  Audit a project's live site for GEO (Generative Engine Optimization) — how
  ready the page is to be CITED by AI search engines (ChatGPT, Claude,
  Perplexity, Gemini, Google AI Overviews), with traditional SEO as the
  supporting foundation.

  Runs against the project's `external_url` (set it on the Projects page; it's
  exposed to the run as `$EXTERNAL_URL`). A `discover` step fetches the page +
  robots.txt + headers (deliberately WITHOUT JavaScript — that's what an AI
  crawler sees), then an analysis step scores it 0–100 across technical /
  crawler-access / structured-data / content dimensions, writes a human-readable
  report (`geo-report.md`), and emits a structured verdict (score + severity-
  tagged findings + a prioritized action plan you can hand to `idea-to-pr`).

  NOT for: code changes (it only reads), or sites without an `external_url`.

provider: claude
model: opus
nodes:
  - id: discover
    category: setup
    bash: |
      set -uo pipefail
      url="$EXTERNAL_URL"
      if [ -z "${url}" ]; then
        echo "No external_url for this project — set it on the Projects page." >&2
        exit 1
      fi
      mkdir -p "$ARTIFACTS_DIR"
      root="$(printf '%s' "$url" | sed -E 's#(https?://[^/]+).*#\1#')"
      echo "Auditing $url (root $root)"

      # Raw homepage HTML with a browser UA — preserves <head> (which AI crawlers
      # read) and is NOT JS-rendered, matching what a crawler actually sees.
      curl -fsSL --max-time 30 -A "Mozilla/5.0 (compatible; harness-geo-audit)" \
        "$url" -o "$ARTIFACTS_DIR/page.html" || echo "(homepage fetch failed)"

      # robots.txt — AI-crawler access rules.
      curl -fsSL --max-time 15 "$root/robots.txt" \
        -o "$ARTIFACTS_DIR/robots.txt" || echo "(no robots.txt)"

      # Status as an AI bot vs a browser. A 403 for the bot UA but 200 for the
      # browser = AI crawlers silently blocked (the classic "invisible to AI").
      curl -sS -o /dev/null -D "$ARTIFACTS_DIR/headers-gptbot.txt" \
        -w "gptbot_status=%{http_code}\n" --max-time 20 \
        -A "Mozilla/5.0 (compatible; GPTBot/1.0; +https://openai.com/gptbot)" "$url" || true
      curl -sS -o /dev/null -D "$ARTIFACTS_DIR/headers-browser.txt" \
        -w "browser_status=%{http_code}\n" --max-time 20 -A "Mozilla/5.0" "$url" || true

      echo "page.html: $(wc -c < "$ARTIFACTS_DIR/page.html" 2>/dev/null || echo 0) bytes"
      echo "DISCOVER-DONE"
    timeout: 120000

  - id: analyze
    category: validation
    provider: claude
    model: opus
    # The audit is the product — reason hard about it.
    effort: high
    context: fresh
    artifact: geo-report.md
    depends_on: [discover]
    prompt: |
      You are a GEO (Generative Engine Optimization) auditor. Assess how ready
      the site at $EXTERNAL_URL is to be CITED by AI search engines (ChatGPT,
      Claude, Perplexity, Gemini, Google AI Overviews), with traditional SEO as
      the supporting foundation. Be concrete and evidence-based — quote what you
      saw.

      The `discover` step already fetched the site. Read these files in
      `$ARTIFACTS_DIR`:
      - `page.html` — the raw homepage HTML. AI crawlers do NOT execute
        JavaScript, so if the `<body>` is essentially empty / client-rendered,
        that is a CRITICAL finding — the page is invisible to them.
      - `robots.txt` — does it allow the AI crawlers (GPTBot, ClaudeBot,
        PerplexityBot, OAI-SearchBot, Google-Extended, …) or block them?
      - `headers-gptbot.txt` / `headers-browser.txt` — compare the status codes;
        a 403/blocked for the bot UA but 200 for the browser = AI crawlers
        blocked at the edge.
      You MAY also read the project's source in the working directory to make a
      finding precise (e.g. point at the component that renders `<head>`), since
      the fix will land as a PR against this repo.

      Score each dimension 0–100, then a weighted composite:
      - **technical** (weight 0.30): server-rendered vs client-only, `<title>` /
        meta description / canonical, Open Graph, HTTPS, security headers.
      - **crawlers** (0.25): AI-crawler access (robots.txt + the bot-UA status).
      - **schema** (0.20): JSON-LD structured data in `page.html` (Organization,
        Article, Person/author, `sameAs` links) — present, valid, useful?
      - **content** (0.25): citability — clear question-answering passages,
        self-contained fact-dense paragraphs, author / E-E-A-T trust signals,
        freshness.
      Composite = Σ(category_score × weight), 0–100. Rating bands: 90–100
      excellent · 75–89 good · 60–74 fair · 40–59 poor · 0–39 critical.

      Write a human-readable report to `$ARTIFACTS_DIR/geo-report.md`:
      an executive summary + the overall score, the per-category scores, the
      findings grouped by severity (each with a concrete fix), and a prioritized
      action plan (quick wins first). Phrase each action item so it can be handed
      to an implementer as a standalone task.

      When done, emit ONLY the JSON verdict matching the schema — no prose, no
      preamble.
    output_format:
      type: object
      properties:
        score:
          type: integer
          description: "Composite GEO score, 0–100."
        rating:
          type: string
          enum: [critical, poor, fair, good, excellent]
        summary:
          type: string
          description: "2–4 sentence executive summary."
        categories:
          type: array
          description: "Per-dimension scores."
          items:
            type: object
            properties:
              key:
                type: string
                description: "technical | crawlers | schema | content"
              weight:
                type: number
              score:
                type: integer
                description: "0–100"
              summary:
                type: string
            required: [key, score, summary]
        findings:
          type: array
          description: "Severity-tagged issues; each fix is an implementable task."
          items:
            type: object
            properties:
              severity:
                type: string
                enum: [critical, high, medium, low]
              category:
                type: string
              title:
                type: string
              detail:
                type: string
              fix:
                type: string
                description: "The concrete change to make, phrased as a task for idea-to-pr."
              effort:
                type: string
                enum: [quick, medium, strategic]
            required: [severity, category, title, fix]
      required: [score, rating, summary, categories, findings]
