name: judge-ab
description: |
  Pairwise A/B quality judge. Given the shared task and the two arms' results,
  decide which arm did the better job and score each 0–100.

  When an arm produced a pull request, the judge reads the actual diff
  (`gh pr diff`) and bases its verdict primarily on the code change — falling
  back to the textual evidence (status, per-step outcomes, final output) when no
  PR is available. The judge model is the workflow default (Claude Opus) unless
  the trigger overrides it, so the judge itself is held constant across a
  comparison.

  The judge then does a SECOND analysis: how much did the shared late-stage
  reviewers (`gpt-review-fix`, `sonnet-review-fix`) shape each arm? Those steps
  run on the SAME models in both arms, so a heavy review contribution is not the
  swapped implementer's credit — and it signals the pipeline's premise (a cheap
  implementer does the bulk; reviewers only polish) is breaking down.

  It also scores plan-adherence per arm — how completely/correctly each arm
  fulfilled the plan it was built against. The plan comes from the SAME planner
  (Opus) in both arms, so this isolates the swapped implementer's execution from
  the planner's design and from the shared reviewers.

  Output: `{ winner, score_a, score_b, reasoning, review_share_a,
  review_share_b, review_assessment, plan_fidelity_a, plan_fidelity_b,
  plan_assessment }`.
provider: claude
model: opus
nodes:
  - id: judge
    category: review
    context: fresh
    prompt: |
      Two AI coding agents ("arm A" and "arm B") performed the SAME task using
      different models. Judge which did the better job, impartially. Do NOT favor
      an arm because of its model name.

      Below is the task, then each arm's result — its model, final status, the
      per-step outcomes, its final output, and (when it opened one) a `PR:` link.

      $ARGUMENTS

      Read the real change before judging:
      - For each arm that has a `PR:` link, inspect the actual diff with
        `gh pr diff <pr-url>` (and `gh pr view <pr-url>` for the description/CI).
        Base your verdict primarily on the code: correctness, whether it fully
        and minimally satisfies the task, edge cases, tests, and code quality.
      - If an arm has no PR (it failed or produced no change), judge it on the
        textual evidence and score it accordingly — a missing/incomplete change
        should not win over a correct one.
      - Read both diffs before deciding; compare them head-to-head.

      Score each arm 0–100 (higher is better). Pick the winner, or "tie" if they
      are genuinely equivalent. Keep the reasoning to 2–4 sentences citing
      concrete differences you saw in the diffs. This is the OVERALL verdict on
      the finished PR — everything included.

      THEN do a second, separate analysis — the review-burden check:
      - This pipeline's premise is that a cheap implementer does the bulk of the
        work and the late reviewers only polish. The final review steps
        (`gpt-review-fix`, then `sonnet-review-fix`) run on the SAME models in
        both arms (see each step's provider/model in the evidence), so whatever
        THEY contributed is not the swapped implementer's credit.
      - Attribute the diff: inspect the PR's commits with
        `gh pr view <pr-url> --json commits` (and `gh api
        repos/{owner}/{repo}/commits/{sha}` for per-commit additions/deletions if
        useful). Commit authors encode the step + model that made them, e.g.
        `gpt-review-fix (openai-codex/gpt-5.5)` and
        `sonnet-review-fix (claude/sonnet)` — use that to separate the late
        reviewers' commits from the implement / early-review commits. If authors
        are a single generic identity (older runs predate per-step attribution),
        fall back to commit messages and say your confidence is lower.
      - For each arm, estimate `review_share` (0–100): the percentage of the
        final, merged change that the late reviewers produced (rewrites and
        structural refactors count more than line count).
      - In `review_assessment`, judge whether the premise held: did the
        implementer carry the work (low review_share — good), or did the
        reviewers rescue it (high review_share or a structural refactor — the
        concept is breaking down)? If a reviewer model is consistently doing the
        heavy lifting, note that it may be the better *implement* model. Compare
        the two arms here too — an arm can win the overall verdict yet have
        leaned harder on the shared reviewers.

      THEN a third analysis — plan adherence:
      - The evidence includes each arm's "Plan it was built against" (from the
        `create-plan` step). The plan comes from the SAME planner in both arms,
        so scoring execution against it isolates the swapped implementer from
        the planner's design and the shared reviewers.
      - For each arm, score `plan_fidelity` (0–100): how completely and
        correctly the delivered change fulfills THAT plan's tasks and acceptance
        criteria — and credit the IMPLEMENTER, not the reviewers (use the
        review_share you just computed: fidelity reached mostly via late-reviewer
        rewrites is weak implementer fidelity).
      - In `plan_assessment`, note per arm: did the implementer execute the plan
        faithfully and completely, or leave gaps the reviewers had to close? Call
        out deviations from the plan (good or bad). If the plan itself was thin
        and the gaps are the plan's fault (not the implementer's), say so — that
        points the fix upstream to planning, not the implementer.

      When done, emit ONLY the JSON verdict — no prose, no preamble.
    output_format:
      type: object
      properties:
        winner:
          type: string
          enum: ["a", "b", "tie"]
          description: "Which arm did the better job overall."
        score_a:
          type: integer
          description: "Quality score for arm A, 0–100."
        score_b:
          type: integer
          description: "Quality score for arm B, 0–100."
        reasoning:
          type: string
          description: "2–4 sentences justifying the verdict, citing concrete differences."
        review_share_a:
          type: integer
          description: "Arm A: % (0–100) of the final change produced by the shared late reviewers (gpt-review-fix, sonnet-review-fix) rather than the implementer."
        review_share_b:
          type: integer
          description: "Arm B: % (0–100) of the final change produced by the shared late reviewers rather than the implementer."
        review_assessment:
          type: string
          description: "2–4 sentences: did the cheap implementer carry the work (premise holds) or did the shared reviewers rescue it (premise breaking down)? Compare the arms; flag if a reviewer model should be the implementer."
        plan_fidelity_a:
          type: integer
          description: "Arm A: how completely/correctly the IMPLEMENTER fulfilled the plan it was built against, 0–100 (discount fidelity reached via late-reviewer rewrites)."
        plan_fidelity_b:
          type: integer
          description: "Arm B: how completely/correctly the IMPLEMENTER fulfilled its plan, 0–100 (discount late-reviewer rewrites)."
        plan_assessment:
          type: string
          description: "2–4 sentences: did each implementer execute its plan faithfully/completely, or leave gaps? Note deviations; if gaps are the plan's fault (thin plan), say the fix is upstream in planning."
      required: [winner, score_a, score_b, reasoning, review_share_a, review_share_b, review_assessment, plan_fidelity_a, plan_fidelity_b, plan_assessment]
