name: judge-ab
description: |
  Pairwise A/B quality judge. Given the shared task and the two arms' results,
  decide which arm did the better job and score each 0–100.

  When an arm produced a pull request, the judge reads the actual diff
  (`gh pr diff`) and bases its verdict primarily on the code change — falling
  back to the textual evidence (status, per-step outcomes, final output) when no
  PR is available. The judge model is the workflow default (Claude Opus) unless
  the trigger overrides it, so the judge itself is held constant across a
  comparison.

  Output: a JSON verdict `{ winner, score_a, score_b, reasoning }`.
provider: claude
model: opus
nodes:
  - id: judge
    category: review
    context: fresh
    prompt: |
      Two AI coding agents ("arm A" and "arm B") performed the SAME task using
      different models. Judge which did the better job, impartially. Do NOT favor
      an arm because of its model name.

      Below is the task, then each arm's result — its model, final status, the
      per-step outcomes, its final output, and (when it opened one) a `PR:` link.

      $ARGUMENTS

      Read the real change before judging:
      - For each arm that has a `PR:` link, inspect the actual diff with
        `gh pr diff <pr-url>` (and `gh pr view <pr-url>` for the description/CI).
        Base your verdict primarily on the code: correctness, whether it fully
        and minimally satisfies the task, edge cases, tests, and code quality.
      - If an arm has no PR (it failed or produced no change), judge it on the
        textual evidence and score it accordingly — a missing/incomplete change
        should not win over a correct one.
      - Read both diffs before deciding; compare them head-to-head.

      Score each arm 0–100 (higher is better). Pick the winner, or "tie" if they
      are genuinely equivalent. Keep the reasoning to 2–4 sentences citing
      concrete differences you saw in the diffs.

      When done, emit ONLY the JSON verdict — no prose, no preamble.
    output_format:
      type: object
      properties:
        winner:
          type: string
          enum: ["a", "b", "tie"]
          description: "Which arm did the better job overall."
        score_a:
          type: integer
          description: "Quality score for arm A, 0–100."
        score_b:
          type: integer
          description: "Quality score for arm B, 0–100."
        reasoning:
          type: string
          description: "2–4 sentences justifying the verdict, citing concrete differences."
      required: [winner, score_a, score_b, reasoning]
