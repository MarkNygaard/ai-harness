name: idea-to-pr
description: |
  The default pipeline: turn a task (title + description, or a PRD path)
  into a reviewed PR, end-to-end.

  Flow: Claude plans (a read-only Sonnet `explore` feeding a lean Opus
  `create-plan`), Kimi (via Pi, on the Kimi-for-Coding subscription)
  implements and self-reviews up to 5x, gpt-5.x via omp does a second-pass
  review-with-fixes, and Claude Sonnet does a third model-diverse
  review-with-fixes — then a final build gate and a workflow-summary comment.

  Output: a PR against the project's base branch (auto-detected from
  `$BASE_BRANCH`), with a single workflow-summary comment (diff + commit
  breakdown across the three review-fix passes).

  Project-specific rules — package manager, verify chain, conventional-
  commit scope vocabulary, agent prohibitions (no `--no-verify`, no
  migration auto-execute, etc.) — live in the project's `CLAUDE.md`
  and/or `AGENTS.md`. The harness auto-loads those into every agent's
  context. This workflow is provider/orchestration only.

  NOT for: standalone reviews, or plans without implementation.

provider: pi
model: kimi-code/kimi-for-coding

nodes:
  - id: explore
    category: planning
    artifact: exploration.md
    provider: claude
    model: sonnet
    context: fresh
    prompt: |
      You are a codebase explorer. Read the task and gather the context
      a planner needs. Do NOT propose a solution and do NOT edit anything.

      ## Task
      $ARGUMENTS

      ## Instructions

      **Multi-repo workspaces:** if `$HARNESS_REPOS` is set, this project spans
      several repos, each checked out in its own folder at the workspace root
      (the JSON in `$HARNESS_REPOS` lists `folder`, `url`, `role`). Make NO
      assumption about any repo's stack — inspect each (its manifest/build
      files) to learn its language/framework. The task may live in any of them,
      so explore **across all** and record, per relevant repo, which folder it
      is and what it is. When `$HARNESS_REPOS` is unset, there's a single repo
      at the root, as usual.

      Use Read, Grep, Glob (and the Explore subagent if helpful) to map
      the part of the codebase this task touches. Don't assume `src/` —
      discover the actual layout. Capture:

      - **Project structure**: where the relevant code lives.
      - **Relevant files**: paths + a one-line purpose each.
      - **Patterns to mirror**: existing conventions the implementation
        must follow (error handling, module layout, test style, naming).
        Quote short snippets with `file:line`.
      - **Constraints**: rules from CLAUDE.md / AGENTS.md that apply.
      - **Risks / edge cases**: prior art, gotchas, things that could break.

      Write your findings to `$ARTIFACTS_DIR/exploration.md`. Be thorough
      on *facts*, but do NOT design the solution — that's the planner's
      job in the next node. Target 300–800 words.

      Output a one-line confirmation and: <promise>EXPLORE-DONE</promise>

  - id: create-plan
    category: planning
    artifact: plan.md
    provider: claude
    model: opus
    # The plan decides everything downstream — run it at max reasoning effort.
    effort: max
    context: fresh
    depends_on: [explore]
    prompt: |
      You are a planner. Turn the task + exploration into a concrete,
      one-pass-implementable plan. PLAN ONLY — write no code.

      This plan is the contract the implementer follows verbatim, so its
      thoroughness sets the ceiling on the result. Design for how the change
      could FAIL, not just the happy path — a good plan leaves the implementer
      nothing to re-decide and a reviewer little to add.

      ## Task
      $ARGUMENTS

      ## Exploration
      Read `$ARTIFACTS_DIR/exploration.md` — the codebase facts are
      already gathered there. Do NOT re-explore; trust the exploration
      and spend your effort on the design. If one critical fact is
      genuinely missing, do a single targeted read — not a broad sweep.

      If this is a multi-repo workspace (`$HARNESS_REPOS` set, and the
      exploration spans several repos), make every "Files to change" entry
      name the **repo folder** it lives in, and design the change so the repos
      stay consistent at their boundary (e.g. a frontend change that depends on
      a backend change — call out the contract both sides must agree on).

      ## Write the plan to `$ARTIFACTS_DIR/plan.md`

      Use these sections:
      - **Summary**: one paragraph — what's being built and the approach.
      - **Files to change**: bullet list, path + reason per file.
      - **Patterns to mirror**: the conventions from exploration this
        change must follow.
      - **Step-by-step tasks**: a numbered list (`1.`, `2.`, …) — each names
        the file(s) and the concrete edit. Granular enough that an implementer
        follows them without re-deciding the approach. The numbering is the
        contract the implementer reports progress against, so keep one concrete
        edit per number.
      - **Robustness & edge cases**: the failure modes and edge cases this
        must handle — error paths, all relevant inputs/events (not just the
        obvious one), and any reliability assumption (e.g. how data/flags
        actually reach the code). Decide these HERE so review doesn't have to.
      - **Testing strategy**: unit tests to add/update + edge cases.
      - **Validation commands**: the project's verify chain (from
        CLAUDE.md / AGENTS.md).
      - **Not building (scope limits)**: what to leave out — and one line of
        *why* each cut is safe for THIS task. Do NOT cut something just because
        the task's wording is literal or it's "extra"; weigh it against the
        task's intent. If a cut is genuinely uncertain, FLAG it for the human
        rather than silently dropping it.
      - **Acceptance criteria**: how we know it's done.

      Prefer minimal, surgical changes that fit existing patterns over
      new abstractions — but "minimal" means no needless scope, not skipping
      robustness the task implies. Honor CLAUDE.md / AGENTS.md.

      ## When there's a real fork, optimize for the outcome
      Some tasks hit a genuine decision point — a quick path that compromises
      versus a more involved path that's clearly better. ALWAYS choose the path
      with the best end result: the most correct, robust, and maintainable
      design, even when it is the larger task. Implementation effort, speed, and
      token cost are NOT factors in this choice — never pick the weaker approach
      because the better one is more work. This governs HOW to build what's in
      scope; it is not licence to expand scope (the "Not building" limits still
      hold). If the better path is materially larger or riskier, still choose it,
      but call out the trade-off in the plan so the human sees what was decided.

      After writing plan.md, output a one-line summary and:
      <promise>PLAN-DONE</promise>

  - id: install-deps
    category: setup
    bash: |
      set -uo pipefail
      # Detect the lockfile in $1 and install. Runs in a subshell so the cd is
      # scoped; returns the install command's exit code.
      install_in() {
        ( cd "$1" 2>/dev/null || { echo "[$1] missing — skipping"; exit 0; }
          if [ -f pnpm-lock.yaml ]; then
            echo "[$1] pnpm"
            pnpm install --frozen-lockfile || exit 1
            if [ -f prisma/schema.prisma ] || grep -q '"db:generate"' package.json 2>/dev/null; then
              pnpm db:generate || exit 1
            fi
          elif [ -f Cargo.toml ]; then echo "[$1] cargo"; cargo fetch --locked || exit 1
          elif [ -f package-lock.json ]; then echo "[$1] npm"; npm ci || exit 1
          elif [ -f uv.lock ]; then echo "[$1] uv"; uv sync --locked || exit 1
          elif [ -f poetry.lock ]; then echo "[$1] poetry"; poetry install --no-interaction || exit 1
          elif [ -f go.mod ]; then echo "[$1] go"; go mod download || exit 1
          else
            echo "[$1] no recognized lockfile — skipping. If this needs setup, \
            add the command to its CLAUDE.md so downstream agents can run it."
          fi )
      }
      # Multi-repo: install each repo's deps in its folder. Single-repo: root.
      rc=0
      if [ -n "${HARNESS_REPOS:-}" ]; then
        while read -r folder; do
          install_in "$folder" || rc=1
        done < <(echo "$HARNESS_REPOS" | jq -r '.[].folder')
      else
        install_in . || rc=1
      fi
      exit $rc
    depends_on: [create-plan]
    timeout: 300000

  - id: implement-tasks
    category: implementation
    command: implement-tasks
    depends_on: [install-deps]
    provider: pi
    model: kimi-code/kimi-for-coding
    context: fresh

  - id: pi-simplify
    category: implementation
    depends_on: [implement-tasks]
    provider: pi
    model: kimi-code/kimi-for-coding
    context: fresh
    prompt: |
      Simplify ONLY the code this PR changed — clarity, redundancy,
      naming, dead code — while preserving behaviour exactly.

      ## Scope (critical — do not exceed it)

      First compute the changed-file set for THIS branch:

          git diff --name-only origin/$BASE_BRANCH...HEAD

      Those files — and ONLY those files — are in scope. Do NOT open,
      read-for-simplification, or edit any file outside that list. You
      are simplifying the work this PR introduced, not auditing the
      repository. (If that command lists nothing, there is nothing to
      do — skip to the no-op path below.)

      ## Process

      Go file by file through the in-scope list. For each, look only for:
      - Unnecessary complexity / deep nesting that can flatten.
      - Redundant or duplicated logic, unused variables/imports.
      - Unclear names; dense one-liners that hurt readability.
      - Obvious comments that just restate the code.
      Match the surrounding module's conventions. Clarity over brevity —
      never introduce clever-but-obscure code or nested ternaries, and
      never drop a feature, output, or behaviour.

      ## Verify BEFORE you commit (non-negotiable)

      After making edits, run the project's scoped verify chain for the
      crates/packages you touched — the commands live in `CLAUDE.md` /
      `AGENTS.md` (auto-loaded into your context). Use the narrowest
      scope that covers your edits. If verification fails, FIX or REVERT
      your simplification until it passes — never commit code that does
      not build and pass its tests. A simplification that breaks the
      build is worse than no simplification.

      ## Commit

      - If, after a green verify, `git status --porcelain` shows modified
        files, stage them and commit ONE conventional-commit:
          `chore: simplify implementation`
        Do NOT push — `finalize-pr` pushes the branch. Do NOT use
        `--no-verify` or skip commit hooks. Do NOT run DB migrations.
      - If you made no changes (or reverted them all), do nothing — a
        no-op is a perfectly good outcome.

      Honor any project-specific agent rules in `CLAUDE.md` / `AGENTS.md`.

      Output a one-line summary (what you simplified + that verify passed,
      or "no changes") and: <promise>SIMPLIFY-DONE</promise>

  - id: validate
    category: validation
    command: validate
    depends_on: [pi-simplify]
    provider: pi
    model: kimi-code/kimi-for-coding
    context: fresh
    # The agent's final message is a {passed, summary} verdict; downstream
    # nodes gate on `$validate.output.passed`.
    output_format:
      type: object
      properties:
        passed: { type: boolean }
        summary: { type: string }
      required: [passed]

  # Fail the run loudly if validation didn't pass — never open a PR on a branch
  # that doesn't build/test clean. (Skipped when validation passed.)
  - id: abort-on-invalid
    category: validation
    depends_on: [validate]
    when: "$validate.output.passed != 'true'"
    cancel: "validation failed — refusing to open a PR. $validate.output.summary"

  - id: finalize-pr
    category: delivery
    command: finalize-pr
    depends_on: [validate]
    when: "$validate.output.passed == 'true'"
    provider: pi
    model: kimi-code/kimi-for-coding
    context: fresh

  - id: verify-pr-base
    category: delivery
    bash: |
      set -uo pipefail
      # Verify every PR this run opened targets its intended base; re-target if
      # drifted. `.pr-list` has one entry per PR ({folder, number, url, base,
      # head}); single-repo is a 1-entry list with folder ".".
      check_pr_base() {
        ( cd "$1" 2>/dev/null || { echo "[$1] missing — skipping"; exit 0; }
          # Multirepo roots and the "." fallback below aren't git repos —
          # running gh/git there fails ("not a git repository"). Skip cleanly.
          git rev-parse --is-inside-work-tree >/dev/null 2>&1 \
            || { echo "[$1] not a git repo — skipping"; exit 0; }
          info=$(gh pr view --json number,baseRefName 2>/dev/null) \
            || { echo "[$1] no PR for current branch — skipping"; exit 0; }
          num=$(echo "$info" | jq -r '.number')
          actual=$(echo "$info" | jq -r '.baseRefName')
          if [ "$actual" != "$2" ]; then
            echo "Base mismatch on PR #$num ($1): expected=$2 actual=$actual — re-targeting" >&2
            gh pr edit "$num" --base "$2"
          else
            echo "PR #$num ($1) base verified: $2"
          fi )
      }
      LIST="$ARTIFACTS_DIR/.pr-list"
      if [ -s "$LIST" ]; then
        while read -r entry; do
          folder=$(echo "$entry" | jq -r '.folder')
          base=$(echo "$entry" | jq -r '.base')
          check_pr_base "$folder" "$base"
        done < <(jq -c '.[]' "$LIST")
      else
        # No list (e.g. nothing changed) — verify the current-dir PR if present.
        check_pr_base "." "$BASE_BRANCH"
      fi
    depends_on: [finalize-pr]

  - id: verify-pr-title
    category: delivery
    depends_on: [verify-pr-base]
    provider: pi
    model: kimi-code/kimi-for-coding
    context: fresh
    prompt: |
      Verify the PR title follows the conventional-commits format.
      If it doesn't, rewrite it via `gh pr edit`.

      ## Which PR(s)
      Run `cat $ARTIFACTS_DIR/.pr-list` — it lists every PR this run opened, as
      JSON objects `{folder, number, url, base, head}`. Apply everything below
      to **each** PR: `cd` into its `folder` first (for a single-repo run there
      is one entry with `folder: "."`, so this is a no-op), and use that entry's
      `base` wherever the steps say `$BASE_BRANCH`. Each PR's title is judged
      against the change in its own repo.

      ## Task
      $ARGUMENTS

      ## Linear-sourced tasks
      If the task above references a Linear issue identifier (it will say
      "Linear issue ABC-123 — …"), the final PR title MUST end with that
      identifier in parentheses — e.g. `feat(api): add webhook (ABC-123)`
      — so Linear links the PR to the issue. Keep the conventional-commits
      prefix; the suffix is part of the description. Do NOT use close
      keywords ("Fixes"/"Closes") — a plain id links without auto-closing
      the issue (the poller owns its status). If the task is not from
      Linear, add no suffix.

      ## Format (universal — same for every project)

          ^(feat|fix|chore|ci|docs|refactor|perf|test)(\([^)]+\))?!?: <description>

      - `<description>` is a short, lower-case imperative summary
        ("wire X to Y", not "Wire X To Y").
      - Breaking change: add `!` after the type (e.g.
        `feat!: remove legacy API`).
      - Scope is optional but encouraged. Use the project's package /
        crate / app name. The vocabulary is project-specific — pick it
        up from:
          1. The project's `CLAUDE.md` / `AGENTS.md` if a scope
             vocabulary is documented there, OR
          2. `git log --oneline origin/$BASE_BRANCH..HEAD~50` — copy
             the convention already in use, OR
          3. The directory structure (top-level `crates/`,
             `packages/`, `apps/` etc. — use the affected one's name).

      ## Type selection rubric (universal)

      | Type | Use when |
      |---|---|
      | `feat` | Adds user-visible functionality. Triggers a minor bump. |
      | `fix` | Fixes a bug. Triggers a patch bump. |
      | `perf` | Performance change without new behavior. Triggers a patch bump. |
      | `refactor` | Internal restructure, no behavior change. No release. |
      | `chore` | Tooling, deps, internal config, agent workflows. No release. |
      | `ci` | CI / release config changes. No release. |
      | `docs` | Docs-only changes. No release. |
      | `test` | Tests-only changes. No release. |

      ## Steps

      1. `gh pr view --json number,title`
      2. If the title already matches the pattern AND the type fits the
         change set (don't accept `chore:` on a PR that adds a new
         feature) AND (for Linear tasks) already carries the
         ` (ABC-123)` suffix, output `TITLE OK: <title>` and emit
         <promise>PR-TITLE-OK</promise>.
      3. Otherwise infer the right type+scope from
         `git diff origin/$BASE_BRANCH...HEAD --stat` and
         `git log --oneline origin/$BASE_BRANCH..HEAD`. Pick the
         dominant scope when multiple packages are touched.
      4. Rewrite the title (appending the ` (ABC-123)` suffix for Linear
         tasks) and apply with
         `gh pr edit <number> --title "<new title>"`.
      5. Output `Renamed PR title to: <new title>` and emit
         <promise>PR-TITLE-OK</promise>.

      Do NOT touch the PR body, labels, base branch, or any other
      property. Title only.

  - id: pi-review-fix-loop
    category: validation
    depends_on: [verify-pr-title]
    loop:
      provider: pi
      model: kimi-code/kimi-for-coding
      max_iterations: 5
      until: PI_REVIEW_CLEAN
      prompt: |
        You are performing a self-review-and-fix pass on a PR that you
        (or an earlier iteration of you) just implemented. This may be
        one of up to 5 such passes — look at the commit history to see
        whether earlier passes have already run. Stop early when you
        have no more substantive issues to fix.

        ## Read the change set first

        `cat $ARTIFACTS_DIR/.pr-list` — the PR(s) this run opened, as JSON
        `{folder, number, url, base, head}`. Usually one entry; a multi-repo
        change has several (one per repo it touched). **Review the whole change
        as a unit** — a fix may span repos (e.g. a frontend calling a backend
        endpoint that changed in the same task), so read every repo's diff
        before judging any of it:

        - For each entry: `cd "$folder"` (single-repo = `.`),
          `gh pr view --json title,body,baseRefName,headRefName,additions,deletions`,
          and `git diff origin/<base>...HEAD` (use that entry's `base`).
        - Hold all the diffs together when you assess correctness — check the
          repos agree at their boundary (API shapes, payloads, contracts).

        Look at any prior iteration's commits — your previous self has
        already addressed those issues. Don't re-flag the same thing.

        Also read `$ARTIFACTS_DIR/plan.md` — the plan you built against.
        Fixing where the code *deviates* from the plan is in scope; *adding*
        things the plan deliberately left out (its "Not building" section) is
        not. If a scope cut looks wrong for the task, note it in your summary
        for the human rather than expanding scope here.

        ## Review categories

        Note: `pi-simplify` has already run upstream and handled pure
        clarity / redundancy / naming / dead-code issues. Don't re-do
        that pass — focus on the categories below, which are more about
        correctness and observability than style.

        Run a self-review against these dimensions:
        - **Correctness**: off-by-one, null/undefined handling, boundary
          conditions, logic errors, edge cases the implementation missed.
        - **Error handling**: silently swallowed errors, unhelpful error
          messages, missing try/catch around external calls, retry/idempotency
          gaps in async code.
        - **Test coverage**: critical paths or new functions without tests,
          mocks that hide real failures, missing edge-case tests for branches
          you added.
        - **Performance**: N+1 queries, unbounded loops, accidental re-renders,
          eager loading where lazy would do, large in-memory payloads.
        - **Security**: SQL injection, XSS, missing auth/scope checks, PII
          leaks into logs, secrets in code, broken access control, unsafe
          type casts (`as any` in TS, `unsafe` blocks in Rust, etc.).
        - **Inconsistencies with sibling code**: comments that contradict
          the code, naming that doesn't match the surrounding module's
          conventions. (Pure clarity / dead-code fixes belong to pi-simplify,
          not here.)
        - **Docs**: behaviour changes that aren't reflected in inline doc
          comments, the project's `CLAUDE.md` / `AGENTS.md`, or its docs site.

        ## Disposition

        For each issue you find:
        1. Fix it directly. Edit the file(s) — in whichever repo folder the
           issue lives (a cross-repo issue may need edits on both sides).
        2. Run that repo's scoped verify chain (from its `CLAUDE.md` /
           `AGENTS.md`), inside the repo folder. Use the narrowest scope that
           covers the change unless the project requires a wider run.
        3. Commit with a conventional-commit message and push **from that
           repo's folder** to its PR branch (each repo has its own PR).

        Universal AI-agent rules (do not violate, even if asked):
        - Do NOT post PR comments or use `gh pr review` from this node.
        - Do NOT use `--no-verify` or otherwise skip commit hooks.
        - Do NOT execute database / schema migrations (`prisma migrate`,
          `sqlx migrate run`, etc.) — edit the schema + write the SQL,
          flag the migration for the human in your summary.
        - Follow any additional project-specific prohibitions in
          `CLAUDE.md` / `AGENTS.md`.

        After fixing this iteration's issues, produce a short summary:

        ```
        ## Self-review iteration N

        Addressed this iteration:
        - <one-line description> — commit <sha>
        ...
        ```

        Then decide:
        - If you found and fixed issues this iteration, end your turn
          (do NOT emit the convergence signal). The orchestrator will run
          another iteration so you can take another pass.
        - If you genuinely have nothing more to improve — code is clean,
          tests cover the change, docs are aligned, no smells — output
          the literal convergence signal:

          <promise>PI_REVIEW_CLEAN</promise>

        Be honest: emitting PI_REVIEW_CLEAN prematurely shifts cost onto
        the gpt-review-fix and Sonnet phases that follow. Emitting it on a clean
        PR is the goal.

  - id: gpt-review-fix
    category: validation
    depends_on: [pi-review-fix-loop]
    provider: pi
    # Runs gpt-5.x via omp on the ChatGPT Plus/Pro subscription (OAuth — no
    # per-token API-key billing; "Codex for OSS"). The ChatGPT account exposes
    # the general gpt-5.x models but NOT the `-codex` variants, so use the
    # general model. The model id MUST be namespace-qualified (`openai-codex/...`):
    # a bare name would be mis-prefixed to `kimi-code/...` by the pi provider.
    # Connect once on the cluster image: `omp /login` → "ChatGPT Plus/Pro
    # (Codex)". To see an account's exact list run `omp` → `/model`.
    model: openai-codex/gpt-5.5
    context: fresh
    prompt: |
      You are reviewing a PR that an upstream agent already authored
      and self-reviewed up to 3 times. Your job is to find what the
      upstream agent missed.

      First read `$ARTIFACTS_DIR/plan.md` — the plan this PR was built
      against. It is the scope contract: anything under its "Not building"
      section was left out ON PURPOSE. Fixing where the code *deviates from
      the plan* is in scope; *adding* capabilities the plan deliberately cut
      is NOT — re-adding correctly-cut scope defeats the point of planning.
      If you believe a scope cut was genuinely wrong for the task, SAY SO in
      your output as a flag for the human; do not silently implement it.

      `cat $ARTIFACTS_DIR/.pr-list` — the PR(s) this run opened, as JSON
      `{folder, number, url, base, head}`. A multi-repo change has several
      (one per repo). **Review the whole change together** — read every repo's
      diff before judging, since the most likely defects are at the seams
      between repos (API shapes, payloads, contracts that must agree). For each
      entry: `cd "$folder"` (single-repo = `.`), `gh pr view`, and
      `git diff origin/<base>...HEAD` using that entry's `base`. Prior
      self-review summaries in each repo's commit history tell you what's
      already addressed, so focus on what's still open.

      Look for issues a single-model review tends to rationalize or miss:
      - Subtle logic bugs (off-by-one, boundary conditions, null/undefined)
      - Race conditions, idempotency gaps in async code or DB writes
      - Performance issues: N+1 queries, unbounded loops, eager loading,
        accidental re-renders, large in-memory payloads
      - Security: SQL injection, XSS, missing auth checks, PII leaks in logs,
        secrets in code, broken access control
      - API design: inconsistent error shapes, leaky abstractions, breaking
        changes that aren't called out

      For each genuine in-scope issue you find, FIX IT directly:
      1. Edit the relevant file(s) — in whichever repo folder the issue lives.
      2. Commit with a conventional-commit message
         (e.g. `fix(scope): handle race in token refresh`).
      3. Push from that repo's folder to its PR branch.

      Do NOT post PR comments. Do NOT use `gh pr review`. Do NOT use --no-verify.
      Push commits — that is the entire output.

      If you genuinely find nothing, push nothing.

      When done, output: <promise>GPT-REVIEW-DONE</promise>


  - id: sonnet-review-fix
    category: validation
    depends_on: [gpt-review-fix]
    provider: claude
    model: sonnet
    context: fresh
    prompt: |
      You are the third, model-diverse review-and-fix pass on a PR that has
      already been planned, implemented, self-reviewed (kimi, up to 3 rounds),
      and reviewed by a second model (gpt) that pushed its own fixes. You bring
      a different training-data / bias profile than the two earlier reviewers —
      your job is to catch what they rationalized or missed, and FIX what is
      concretely fixable.

      First read `$ARTIFACTS_DIR/plan.md` — the plan this PR was built against.
      It is the scope contract: anything under its "Not building" section was
      left out ON PURPOSE. Fixing where the code *deviates from the plan* is in
      scope; *adding* capabilities the plan deliberately cut is NOT — re-adding
      correctly-cut scope defeats the point of planning. If you believe a scope
      cut was genuinely wrong for the task, SAY SO in your output as a flag for
      the human; do not silently implement it.

      `cat $ARTIFACTS_DIR/.pr-list` — the PR(s) this run opened, as JSON
      `{folder, number, url, base, head}`. A multi-repo change has several
      (one per repo). **Review the whole change together** — read every repo's
      diff before judging, since the most likely defects are at the seams
      between repos (API shapes, payloads, contracts that must agree). For each
      entry: `cd "$folder"` (single-repo = `.`), `gh pr view`,
      `git diff origin/<base>...HEAD` using that entry's `base`, and
      `git log --oneline origin/<base>..HEAD` — the paper trail of prior fixes
      tells you what is already addressed, so focus on what is still open.

      Look for issues two prior review passes tend to rationalize or miss:
      - Subtle logic bugs (off-by-one, boundary conditions, null/undefined)
      - Race conditions, idempotency gaps in async code or DB writes
      - Performance: N+1 queries, unbounded loops, large in-memory payloads
      - Security: injection, XSS, missing auth checks, PII in logs, secrets
      - API design: inconsistent error shapes, leaky abstractions, breaking
        changes that are not called out
      - Test honesty: tests pin real invariants, not happy paths only
      - Upstream guardrail compliance: `CLAUDE.md` / `AGENTS.md` is auto-loaded
        into your context. Verify the upstream agents respected its rules — no
        `--no-verify`, no migrations executed, no scope-violating commands, no
        lockfile churn unrelated to the change.

      For each genuine in-scope issue you find, FIX IT directly:
      1. Edit the relevant file(s) — in whichever repo folder the issue lives.
      2. Run the project's scoped verify chain — see `CLAUDE.md` / `AGENTS.md`
         for the commands; use the narrowest scope that covers the change.
      3. Commit with a conventional-commit message and push from that repo's
         folder to its PR branch.

      Universal rules: do NOT skip commit hooks, do NOT use `--no-verify`, do
      NOT execute database / schema migrations (`prisma migrate`,
      `sqlx migrate run`, etc.) — edit the schema + SQL only and flag the
      migration for the human in your output.

      If a finding is fixable but you are not confident your fix is correct, or
      it is a judgment call (scope ambiguity, architectural risk), do NOT touch
      the code — flag it in your output for the human instead.

      Do NOT post PR comments. Do NOT use `gh pr review`. Do NOT set PR labels.
      Push commits — that is the entire output. If you genuinely find nothing,
      push nothing.

      When done, output: <promise>SONNET-REVIEW-DONE</promise>

  - id: final-verify-loop
    category: validation
    depends_on: [sonnet-review-fix]
    loop:
      provider: pi
      model: kimi-code/kimi-for-coding
      max_iterations: 3
      until: FINAL_VERIFY_CLEAN
      prompt: |
        Final build gate — the last node that can touch code before the
        run completes. Every fix-capable node upstream (implement, the
        kimi self-review loop, gpt-review-fix, sonnet) has already pushed its
        changes. CRITICAL: the `validate` node ran much EARLIER in the
        pipeline, before those review fixes — so the branch HEAD may not
        compile even though `validate` reported green. Re-verify the
        FINAL state.

        ## Multi-repo

        `cat $ARTIFACTS_DIR/.pr-list`. If it has more than one entry, this change
        spans several repos — run Steps A–E **inside each repo's folder**
        (`cd "$folder"`), using that entry's `base` wherever the steps say
        `$BASE_BRANCH` and that repo's own verify chain (from its `CLAUDE.md` /
        `AGENTS.md`). The web/cargo scoping below is an example for repos with
        that layout — a repo of another stack uses its own chain. Only emit the
        clean signal once **every** repo's authoritative chain is green and you
        pushed nothing this iteration. Single-repo (one entry, `folder: "."`) →
        the steps below as written.

        ## Step A — see what landed

        `git log --oneline -8` — understand the fixes that landed after validate.

        ## Step B — scope the chain to the diff

        Compute the changed set:
        `git diff --name-only origin/$BASE_BRANCH...HEAD`

        - **Web-only** (every path starts with `web/`): run **only**
          `cd web && bunx tsc --noEmit && bunx vitest run && bunx vite build`.
          Run **no cargo**. This is what turns a web-only PR from ~32 min to ~3 min.
        - **Rust-touching** (any path under `crates/`, `Cargo.toml`, or `Cargo.lock`):
          run the Rust full gate —
          `RUSTFLAGS="-Dwarnings" cargo clippy --workspace --all-targets` then
          `cargo nextest run --workspace`.
        - **Mixed**: run both chains.
        - **Empty diff or root-only files** (`Cargo.toml`, `Cargo.lock` with no
          crate paths): treat as Rust+web full gate fallback — do not emit clean
          blindly.

        ## Step C — iteration scoping

        This loop runs up to 3 iterations. The scoping rule depends on whether
        this iteration is the authoritative pass or a fix re-check:

        - **First pass, or the pass that declares clean** → run the FULL chain
          for the detected scope above (the authoritative gate).
        - **A pass that runs only because the previous iteration pushed a fix**
          → you may scope to the crates your fix touched to check it fast:
          compute them from `git diff --name-only HEAD~1...HEAD`, map each
          `crates/<name>/...` path to its crate, then run
          `cargo nextest run -p <crate>` + `cargo clippy -p <crate>
          --all-targets` for each. (Web-only fixes re-run only the bun chain.)
          If the fix touched `Cargo.toml` or `Cargo.lock` with no single crate,
          fall back to the full workspace gate for that iteration.
        - **Convergence rule**: only emit `<promise>FINAL_VERIFY_CLEAN</promise>`
          after a pass where you ran the FULL authoritative chain for the
          detected scope AND it was clean AND you pushed nothing this iteration.
          If your last action was a scoped re-check that passed, do one full
          authoritative pass before emitting the signal.

        ## Step D — on failure

        If anything fails (compile error, lint, format, test):
        - Fix the root cause. Never disable a check, never use `--no-verify`,
          never skip hooks, never run DB migrations.
        - Commit the fix with a conventional-commit message and push to the
          PR branch.
        - End your turn WITHOUT the signal — the loop runs again so you
          re-verify from a clean slate.

        ## Step E — final-iteration failure

        If the chain still fails on the final iteration, do NOT emit the
        signal. The run will fail — that is the correct outcome: the branch
        HEAD is broken and a human needs to look. Summarize what's still red.

  - id: workflow-summary
    category: delivery
    depends_on: [final-verify-loop]
    provider: pi
    model: kimi-code/kimi-for-coding
    context: fresh
    prompt: |
      Post a short "workflow complete" PR comment that reflects what
      ACTUALLY happened in this run. Don't suggest running review
      agents — three review-and-fix passes (kimi self-review loop, gpt-review-fix,
      sonnet-review-fix) already ran in this same workflow and pushed their fixes
      as commits. This comment is the run's single human-facing overview: a thin
      status line with the commit breakdown, not a second review.

      ## Read first

      `cat $ARTIFACTS_DIR/.pr-list` — every PR this run opened
      (`{folder, number, url, base, head}`); usually one, several for a
      multi-repo change. For each, from its `folder`:

      1. `gh pr view --json number,title,headRefName,additions,deletions`.
      2. `git log --oneline origin/<base>..HEAD` (that entry's `base`) — every
         commit that landed, including the gpt-review-fix and sonnet-review-fix passes.
      3. Count commits by phase using the conventional-commit prefixes
         (feat / fix / chore / etc.) and any phase markers in the bodies.

      ## Output: one short PR comment (per PR)

      Post the summary to **each** PR in `.pr-list` (from its folder, using its
      number). For a multi-repo change, add a line listing the sibling PRs so a
      reader can see the whole change — e.g. `**Part of**: <other PR urls>`. Use
      `gh pr comment <number> --body "..."` with this shape:

      ```
      ## Workflow complete — `idea-to-pr`

      **Diff**: +<additions> / -<deletions>

      **Commit breakdown**:
      - Implementation + kimi self-review: <N> commits
      - gpt-review-fix pass: <N> commits (or "none — nothing to fix")
      - sonnet-review-fix pass: <N> commits (or "none — nothing to fix")
      ```

      Rules:
      - One short comment. No "review agents have not yet run" wording —
        they ran. No "next steps" suggestion blocks.
      - No deviations table, no validation table, no follow-up issue
        suggestions.
      - If commit counts can't be cleanly inferred from prefixes, just
        say "X commits total" rather than guessing per-phase.

      Output: <promise>WORKFLOW-SUMMARY-DONE</promise>
