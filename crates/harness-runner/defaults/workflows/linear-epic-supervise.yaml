name: linear-epic-supervise
description: |
  Grade a merged epic piece against its own acceptance criteria, then advance
  the next one — or file a corrective.

  Bind this to the column a piece lands in once its PR is merged. It reads the
  sub-issue's acceptance criteria, judges the code that is now on the base
  branch, and does one of three things: start the next piece, file a corrective
  sub-issue, or stop and ask for a human.

  **The verdict is the gate.** A piece that was built but built wrong does not
  advance the epic, because everything after it is written against what it was
  supposed to do.

  **Nothing is stored here.** The epic's memory is its board: the pieces, their
  order, their columns, and a `Corrects: AIH-12` line in each corrective's body.
  That line is what counts fix rounds — a label would be prettier, but it would
  make the cap depend on configuration, and an uncountable cap is no cap.

  Bounded, per the design's decided defaults:

    * **2 corrective rounds per piece** (the build plus two fixes). Three
      failures is almost always a specification problem, and a fourth attempt
      spends money to prove it again.
    * **15 correctives per epic**, as a runaway backstop.

  On either limit the epic stops and says so, rather than continuing to spend.

  Project env vars, all optional — without them the workflow reports what it
  would have done instead of doing it, which is the right failure for something
  that writes to your board:

    * `EPIC_READY_STATE` — normally unnecessary. The column a piece starts in
      is derived from the claims the poller already records, so this is only
      an override for a board that wants somewhere else.
    * `EPIC_BLOCKED_STATE` — where a stalled epic goes.
    * `EPIC_CORRECTIVE_LABEL` — a label id put on correctives, for looks.

  It also **starts** an epic. Hand it the epic itself — an issue with
  sub-issues and no parent — and it creates the integration branch
  `epic/<identifier>` and moves the first piece into the build column.

  **Every piece is built on that branch and merged into it**, so the feature
  accumulates in one place and `main` sees it once, finished, rather than in
  pieces. When the last piece is accepted the branch becomes a single pull
  request against the default branch, and the epic moves to `EPIC_REVIEW_STATE`
  if that is set. **Nothing merges it** — it is the whole feature, and the one
  review that was never a piece. Piece N+1 branches from something that already contains 1..N. The
  poller derives the branch name from a piece's parent, so nothing has to be
  configured for this — but it does mean the branch must exist before the first
  piece starts, which is why it is created here. Hand it a merged piece and it grades that piece. The two are told
  apart by whether the issue has a parent, which needs no configuration and
  cannot be set wrong.

  An issue that is neither — no parent, no children — cancels cleanly rather
  than failing, since the likely cause is a column that also holds ordinary
  work.

  NOT for: building a piece — that is `idea-to-pr`, bound to whichever column
  you park pieces in.

provider: claude
model: opus

nodes:
  # ── What is this, and what is around it ──────────────────────────────────
  - id: context
    category: setup
    bash: |
      set -uo pipefail
      issue="$ISSUE_ID"
      mkdir -p "$ARTIFACTS_DIR"

      if [ -z "$issue" ]; then
        echo "linear-epic-supervise is triggered by a Linear binding; this run has no issue." >&2
        exit 1
      fi

      harness linear issue --issue "$issue" \
        > "$ARTIFACTS_DIR/piece.json" || exit 1
      parent="$(jq -r '.parent_id // empty' "$ARTIFACTS_DIR/piece.json")"

      # Three things can arrive here, and only one of them is a merged piece.
      if [ -z "$parent" ]; then
        # No parent: either an epic that has just been handed over to be
        # started, or an ordinary issue that does not belong here at all. Its
        # own children are what tells them apart.
        harness linear children --issue "$issue" \
          > "$ARTIFACTS_DIR/children.json" || exit 1
        kids="$(jq 'length' "$ARTIFACTS_DIR/children.json")"

        if [ "$kids" -eq 0 ]; then
          echo '{"mode": "neither"}'
          exit 0
        fi

        # The first piece that has not **begun**, in board order — not simply
        # the first. An epic can arrive here more than once (a re-delegation, a
        # column it lands in again), and "first by order" would restart a piece
        # already building every single time.
        #
        # Linear's own state category answers this without configuration: a
        # piece is waiting if its state is `backlog` or `unstarted`.
        unstarted='[.[] | select(.state_type == "backlog" or .state_type == "unstarted")] | sort_by(.sortOrder)'
        first_id="$(jq -r "$unstarted | .[0].id // empty" "$ARTIFACTS_DIR/children.json")"
        first_ident="$(jq -r "$unstarted | .[0].identifier // empty" "$ARTIFACTS_DIR/children.json")"

        if [ -z "$first_id" ]; then
          # Every piece is under way or finished. Nothing to start, and saying
          # so beats starting something twice.
          echo '{"mode": "nothing-to-start"}'
          exit 0
        fi
        # The epic's own identifier names its integration branch, and the poller
        # derives the same name when it bases each piece on it.
        epic_ident="$(jq -r '.identifier // empty' "$ARTIFACTS_DIR/piece.json")"
        if [ -z "$epic_ident" ]; then
          echo "Linear did not return this epic's identifier, so its branch cannot be named." >&2
          exit 1
        fi
        jq -n --arg id "$first_id" --arg ident "$first_ident" --arg epic "$epic_ident" \
              --argjson kids "$kids" \
          '{mode: "epic", first_id: $id, first_ident: $ident, epic_ident: $epic, pieces: $kids}'
        exit 0
      fi

      harness linear children --issue "$parent" \
        > "$ARTIFACTS_DIR/siblings.json" || exit 1

      me="$(jq -r --arg id "$issue" '.[] | select(.id == $id)' "$ARTIFACTS_DIR/siblings.json")"
      if [ -z "$me" ]; then
        echo "This issue is not among its own parent's children — refusing to guess." >&2
        exit 1
      fi
      ident="$(printf '%s' "$me" | jq -r '.identifier')"
      order="$(printf '%s' "$me" | jq -r '.sortOrder')"
      printf '%s' "$me" | jq -r '.body // ""' > "$ARTIFACTS_DIR/criteria.md"

      # A corrective names what it corrects; the rounds belong to that original,
      # not to the corrective. A piece with no such line is itself the original.
      subject="$(grep -m1 -oE '^Corrects: [A-Za-z]+-[0-9]+' "$ARTIFACTS_DIR/criteria.md" \
        | awk '{print $2}')"
      [ -n "$subject" ] || subject="$ident"

      rounds="$(jq --arg s "Corrects: $subject" \
        '[.[] | select((.body // "") | contains($s))] | length' "$ARTIFACTS_DIR/siblings.json")"
      epic_total="$(jq '[.[] | select((.body // "") | test("^Corrects: "; "m"))] | length' \
        "$ARTIFACTS_DIR/siblings.json")"

      # Has the epic already moved past this piece? A piece is judged once.
      # Nothing moves an issue out of the column a merged piece rests in, so
      # the poller keeps offering it: this same piece was reviewed six times in
      # half an hour, and each review ran `advance` again — which is how a
      # later piece was started while the one before it was still building.
      #
      # `release` below is the real fix; this is the guard for the window
      # between a review finishing and the delegate actually clearing, and for
      # any issue re-delegated by hand after the fact.
      #
      # Build order is ascending `sortOrder`, so a *later* piece is a higher
      # one. If any later piece has begun, this piece's verdict was already
      # acted on.
      ahead="$(jq -r --argjson o "$order" \
        '[.[] | select(.sortOrder > $o)
              | select(.state_type == "started" or .state_type == "completed")]
         | length' "$ARTIFACTS_DIR/siblings.json")"
      if [ "$ahead" -gt 0 ]; then
        jq -n --arg ident "$ident" '{mode: "already-judged", identifier: $ident}'
        exit 0
      fi

      # The next piece is the next one that has not begun — not the next by
      # order. Two things depend on that difference: a corrective filed later
      # sorts *above* the piece it corrects (Linear gives new issues the lowest
      # sortOrder), so "next after this one" would skip it forever; and a piece
      # already building must not be started again.
      unstarted='[.[] | select(.state_type == "backlog" or .state_type == "unstarted")] | sort_by(.sortOrder)'
      next_id="$(jq -r "$unstarted | .[0].id // empty" "$ARTIFACTS_DIR/siblings.json")"
      next_ident="$(jq -r "$unstarted | .[0].identifier // empty" "$ARTIFACTS_DIR/siblings.json")"

      # The epic's own name, for the pull request that lands the finished
      # feature. Both come from the piece's context read, so no extra call.
      epic_ident="$(jq -r '.parent_identifier // empty' "$ARTIFACTS_DIR/piece.json")"

      jq -n --arg parent "$parent" --arg ident "$ident" --arg subject "$subject" \
            --arg next_id "$next_id" --arg next_ident "$next_ident" \
            --arg epic_ident "$epic_ident" \
            --argjson rounds "$rounds" --argjson epic_total "$epic_total" \
        '{mode: "piece", parent: $parent, identifier: $ident, subject: $subject,
          next_id: $next_id, next_ident: $next_ident, epic_ident: $epic_ident,
          rounds: $rounds, epic_total: $epic_total}'

  # ── An epic was handed over: start its first piece ───────────────────────
  - id: start-epic
    category: delivery
    depends_on: [context]
    when: "$context.output.mode == 'epic'"
    bash: |
      set -uo pipefail
      epic="$ISSUE_ID"
      first_id="$context.output.first_id"
      first_ident="$context.output.first_ident"
      branch="epic/$context.output.epic_ident"
      # Where a piece goes to be built. Derived, not configured: the poller
      # records the column every issue was claimed from, and an epic is picked
      # up by the same binding its pieces are, so the epic's own claim already
      # says where the first piece belongs. The environment variable stays as
      # an override for a board that wants somewhere else.
      ready="${EPIC_READY_STATE:-}"
      if [ -z "$ready" ]; then
        ready="$(harness linear ready-state 2>/dev/null | jq -r '.state // empty')"
      fi
      note="$ARTIFACTS_DIR/note.md"

      # The integration branch. Every piece of this epic is built on it and
      # merged into it, so `main` sees the feature once, finished, rather than
      # in pieces — and piece N+1 branches from something that already contains
      # 1..N. It must exist before the first piece starts, because the poller
      # bases that run on it by name.
      #
      # Pushed empty, straight off the base branch. This run's worktree is
      # already cut from that base, so the branch is exactly `main` at this
      # moment plus nothing.
      if git ls-remote --exit-code --heads origin "$branch" > /dev/null 2>&1; then
        echo "$branch already exists — leaving it alone"
      elif git push origin "HEAD:refs/heads/$branch" 2>"$ARTIFACTS_DIR/push.err"; then
        echo "created $branch"
      else
        echo "Could not create $branch — the epic cannot start without it:" >&2
        cat "$ARTIFACTS_DIR/push.err" >&2
        exit 1
      fi

      if [ -z "$ready" ]; then
        {
          echo "**This epic has $context.output.pieces pieces.** First up is $first_ident."
          echo
          echo "The feature will accumulate on \`$branch\`."
          echo
          echo "_Could not work out which column starts a build, so start it by hand. Set EPIC_READY_STATE on the project to say explicitly._"
        } > "$note"
      elif harness linear move-state --issue "$first_id" --state "$ready"; then
        {
          echo "**Started $first_ident**, the first of $context.output.pieces pieces."
          echo
          echo "The feature accumulates on \`$branch\`. Each piece is built on that"
          echo "branch and reviewed against its own acceptance criteria before the"
          echo "next begins; \`main\` sees it once, finished."
        } > "$note"
      else
        {
          echo "**Could not start $first_ident.** Move it by hand to begin the epic."
        } > "$note"
      fi

      harness linear comment --issue "$epic" --body-file "$note" \
        || echo "could not write the ledger comment; the state change stands" >&2
      cat "$note"

  - id: not-a-piece
    category: setup
    depends_on: [context]
    when: "$context.output.mode == 'neither'"
    cancel: "This issue is neither a piece of an epic nor an epic with pieces, so there is nothing to supervise."

  - id: already-started
    category: setup
    depends_on: [context]
    when: "$context.output.mode == 'nothing-to-start'"
    cancel: "Every piece of this epic is already under way or finished. Nothing to start — the epic advances when a piece is reviewed, not when the epic is handed over again."

  - id: already-judged
    category: setup
    depends_on: [context]
    when: "$context.output.mode == 'already-judged'"
    bash: |
      set -uo pipefail
      # Judged already, and the epic has moved on. Give the issue up so the
      # poller stops offering it, then say so and stop — re-reviewing a merged
      # piece costs an Opus run and can start the piece after the one that is
      # already building.
      harness linear release --issue "$ISSUE_ID" \
        || echo "could not release this piece; it may be offered again" >&2
      echo "$context.output.identifier was already judged and the epic has moved past it."

  # ── The judgement ────────────────────────────────────────────────────────
  #
  # No checkout step: the run's worktree is already cut from the base branch,
  # which is where this piece was merged. The code under review is the code in
  # the working directory.
  - id: review
    category: validation
    provider: claude
    model: opus
    effort: max
    context: fresh
    depends_on: [context]
    when: "$context.output.mode == 'piece'"
    prompt: |
      A piece of an epic ($context.output.identifier) was built and merged into
      this branch. Decide whether it actually does what it was supposed to.

      Its acceptance criteria are in `$ARTIFACTS_DIR/criteria.md`. Read that
      first, then read the code. Judge **against those criteria and nothing
      else** — not against what you would have built, not against style, not
      against work the criteria assign to a later piece.

      What a failure means here: the next piece is written against this one
      having worked, so passing something broken costs more than one wasted
      round. What a false failure costs: a corrective sub-issue and another
      build. Neither is free; be accurate rather than cautious.

      Look for the criteria being *met*, not merely *addressed*. A function that
      exists but is never called, a flag that is parsed but not read, a test
      that asserts nothing — these are the failures worth catching, because a
      reviewer skimming the diff will not.

      If it falls short, say precisely what is missing, in terms someone could
      build from without re-deriving the whole task. That text becomes the body
      of the corrective sub-issue.

      **Write your prose to files, not into the JSON.** Put the verdict summary
      in `$ARTIFACTS_DIR/summary.md`, and — only when failing — what is missing
      in `$ARTIFACTS_DIR/shortfall.md`. Both are copied verbatim into a Linear
      comment, so: prose and markdown only, a few short paragraphs at most, and
      never pasted command or test output. Say the suite passed; do not
      reproduce what it printed.

      This is not a formatting preference. The JSON fields are substituted into
      a shell script, where a backtick runs as a command — an earlier verdict
      reached Linear with its code spans silently executed away. Keep `summary`
      to a single plain sentence and put everything else in the files.
    output_format:
      type: object
      properties:
        passed:
          type: boolean
          description: "True only if every acceptance criterion is genuinely met."
        summary:
          type: string
          description: "2-4 sentences: what was built, and the basis for the verdict. Prose only -- never paste command or test output; say that the suite passed, not what it printed."
        shortfall:
          type: string
          description: "When failing: what is missing and what would fix it, as a task. Empty when passing."
      required: [passed, summary]

  # ── It worked: start the next piece ──────────────────────────────────────
  - id: advance
    category: delivery
    depends_on: [review]
    when: "$review.output.passed == 'true'"
    bash: |
      set -uo pipefail
      # The verdict prose is read from the files the reviewer wrote, never
      # from the JSON: those fields are substituted into this script, where a
      # backtick would run as a command.
      [ -s "$ARTIFACTS_DIR/summary.md" ] || echo "_The reviewer left no summary._" > "$ARTIFACTS_DIR/summary.md"
      [ -s "$ARTIFACTS_DIR/shortfall.md" ] || echo "_The reviewer left no detail._" > "$ARTIFACTS_DIR/shortfall.md"

      parent="$context.output.parent"
      next_id="$context.output.next_id"
      next_ident="$context.output.next_ident"
      # Same derivation as start-epic, from the piece just reviewed: it was
      # built by the binding we are looking for, so its own claim names the
      # column.
      ready="${EPIC_READY_STATE:-}"
      if [ -z "$ready" ]; then
        ready="$(harness linear ready-state --issue "$ISSUE_ID" 2>/dev/null | jq -r '.state // empty')"
      fi
      note="$ARTIFACTS_DIR/note.md"

      if [ -z "$next_id" ]; then
        # Every piece is in. The epic branch now *is* the feature, so it becomes
        # one pull request against the default branch — the first and only point
        # at which the whole change is reviewable as a whole.
        #
        # `$BASE_BRANCH` is the epic branch: this run was based on it in order
        # to review the piece that merged into it.
        default_branch="$(gh repo view --json defaultBranchRef -q .defaultBranchRef.name 2>/dev/null)"
        [ -n "$default_branch" ] || default_branch="main"

        # Idempotent: a re-run must not open a second pull request for the same
        # branch, and finding the existing one is as good as creating it.
        pr="$(gh pr list --head "$BASE_BRANCH" --base "$default_branch" \
              --state open --json url -q '.[0].url' 2>/dev/null)"
        if [ -z "$pr" ]; then
          body="$ARTIFACTS_DIR/epic-pr.md"
          {
            echo "Closes $context.output.epic_ident."
            echo
            echo "**This is the first review of the whole change.** Each piece"
            echo "below was built on this branch and graded against its own"
            echo "acceptance criteria before the next began, so what has *not*"
            echo "been reviewed is how they fit together."
            echo
            echo "Built in this order:"
            echo
            # By completion, not by `sortOrder`. Linear reassigns sortOrder
            # when an issue moves between columns, so by the time an epic
            # finishes it describes where the cards ended up rather than what
            # happened first -- and the list came out reversed. A piece with
            # no completion time (a cancelled corrective, say) sorts last
            # rather than vanishing.
            jq -r 'sort_by(.completed_at // "9999") | .[] | "- \(.identifier)  \(.title)"' \
              "$ARTIFACTS_DIR/siblings.json"
          } > "$body"
          pr="$(gh pr create --base "$default_branch" --head "$BASE_BRANCH" \
                --title "$context.output.epic_ident — the finished feature" \
                --body-file "$body" 2>&1)" || {
              echo "Could not open the epic's pull request:" >&2
              echo "$pr" >&2
              pr=""
            }
        fi

        # Hand the epic to a human. Nothing merges this automatically: it is
        # the whole feature, and the one review that was never a piece.
        # Where the finished epic goes, from the supervisor's own binding —
        # picked from a dropdown like every other column, rather than pasted in
        # as a state id. The environment variable stays as an override.
        review_state="${EPIC_REVIEW_STATE:-}"
        if [ -z "$review_state" ]; then
          review_state="$(harness linear epic-review-state 2>/dev/null | jq -r '.state // empty')"
        fi
        if [ -n "$review_state" ]; then
          harness linear move-state --issue "$parent" --state "$review_state" \
            || echo "could not move the epic to EPIC_REVIEW_STATE" >&2
        fi

        {
          echo "**$context.output.identifier passed — and it was the last piece.**"
          echo
          cat "$ARTIFACTS_DIR/summary.md"
          echo
          if [ -n "$pr" ]; then
            echo "Every piece is in. The feature is one pull request against"
            echo "\`$default_branch\`: $pr"
          else
            echo "Every piece is in, on \`$BASE_BRANCH\`. Opening its pull"
            echo "request failed — raise it by hand."
          fi
        } > "$note"
      elif [ -n "$ready" ]; then
        if harness linear move-state --issue "$next_id" --state "$ready"; then
          started="started $next_ident"
        else
          started="could not start $next_ident — move it by hand"
        fi
        {
          echo "**$context.output.identifier passed.** $started."
          echo
          cat "$ARTIFACTS_DIR/summary.md"
        } > "$note"
      else
        {
          echo "**$context.output.identifier passed.** Next up is $next_ident."
          echo
          cat "$ARTIFACTS_DIR/summary.md"
          echo
          echo "_Could not work out which column starts a build, so start it by hand. Set EPIC_READY_STATE on the project to say explicitly._"
        } > "$note"
      fi

      # Done with this piece. Nothing moved it out of the column a merged
      # piece rests in, so without giving up the delegate the poller offers it
      # again every tick -- the same piece was reviewed six times in half an
      # hour, and every repeat ran this node again, starting a later piece
      # while the one before it was still building.
      harness linear release --issue "$ISSUE_ID" \
        || echo "could not release this piece; it may be judged again" >&2

      harness linear comment --issue "$parent" --body-file "$note" \
        || echo "could not write the ledger comment; the state change stands" >&2
      cat "$note"

  # ── It did not: correct it, or stop ──────────────────────────────────────
  - id: correct
    category: delivery
    depends_on: [review]
    when: "$review.output.passed != 'true'"
    bash: |
      set -uo pipefail
      # The verdict prose is read from the files the reviewer wrote, never
      # from the JSON: those fields are substituted into this script, where a
      # backtick would run as a command.
      [ -s "$ARTIFACTS_DIR/summary.md" ] || echo "_The reviewer left no summary._" > "$ARTIFACTS_DIR/summary.md"
      [ -s "$ARTIFACTS_DIR/shortfall.md" ] || echo "_The reviewer left no detail._" > "$ARTIFACTS_DIR/shortfall.md"

      parent="$context.output.parent"
      subject="$context.output.subject"
      rounds="$context.output.rounds"
      epic_total="$context.output.epic_total"
      note="$ARTIFACTS_DIR/note.md"

      # Two caps, both from the design. The first says this piece is
      # underspecified; the second says the epic is.
      stop=""
      if [ "$rounds" -ge 2 ]; then
        stop="$subject has had $rounds corrective rounds already. Three failures is a specification problem, not an effort problem."
      elif [ "$epic_total" -ge 15 ]; then
        stop="This epic has produced $epic_total correctives. Stopping before it produces more."
      fi

      if [ -n "$stop" ]; then
        {
          echo "**Stopped on $context.output.identifier.**"
          echo
          echo "$stop"
          echo
          echo "What the review found:"
          echo
          cat "$ARTIFACTS_DIR/shortfall.md"
        } > "$note"
        harness linear comment --issue "$parent" --body-file "$note" || true
        blocked="${EPIC_BLOCKED_STATE:-}"
        if [ -n "$blocked" ]; then
          harness linear move-state --issue "$parent" --state "$blocked" \
            || echo "could not move the epic to EPIC_BLOCKED_STATE" >&2
        fi
        harness linear release --issue "$ISSUE_ID" \
          || echo "could not release this piece; it may be judged again" >&2
        cat "$note"
        # A stop is an outcome, not a crash: the epic is paused deliberately and
        # the run has done its job.
        exit 0
      fi

      # `Corrects:` on the first line is what the next round counts. It is the
      # mechanism, not decoration — keep it first and keep the format.
      body="$ARTIFACTS_DIR/corrective.md"
      {
        echo "Corrects: $subject"
        echo
        cat "$ARTIFACTS_DIR/shortfall.md"
        echo
        echo "---"
        echo "_Filed by the epic supervisor after reviewing $context.output.identifier._"
      } > "$body"

      label="${EPIC_CORRECTIVE_LABEL:-}"
      if [ -n "$label" ]; then
        out="$(harness linear create-sub-issue --parent "$parent" \
          --title "Fix: $subject" --description-file "$body" --label "$label" 2>&1)" || {
            echo "could not file the corrective:" >&2; echo "$out" >&2; exit 1; }
      else
        out="$(harness linear create-sub-issue --parent "$parent" \
          --title "Fix: $subject" --description-file "$body" 2>&1)" || {
            echo "could not file the corrective:" >&2; echo "$out" >&2; exit 1; }
      fi

      {
        echo "**$context.output.identifier did not pass.** Filed $out as round $((rounds + 1)) of 2."
        echo
        cat "$ARTIFACTS_DIR/summary.md"
      } > "$note"
      # Done with this piece. Nothing moved it out of the column a merged
      # piece rests in, so without giving up the delegate the poller offers it
      # again every tick -- the same piece was reviewed six times in half an
      # hour, and every repeat ran this node again, starting a later piece
      # while the one before it was still building.
      harness linear release --issue "$ISSUE_ID" \
        || echo "could not release this piece; it may be judged again" >&2

      harness linear comment --issue "$parent" --body-file "$note" \
        || echo "could not write the ledger comment; the corrective is filed regardless" >&2
      cat "$note"
