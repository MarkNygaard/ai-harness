[package]
name = "harness-dag"
version.workspace = true
edition.workspace = true
description = "Workflow DAG model, YAML loader, topological scheduling, and template-variable substitution for the Harness orchestration layer"
license.workspace = true
repository.workspace = true

[dependencies]
serde = { workspace = true }
serde_json = { workspace = true }
serde_yaml = { workspace = true }
thiserror = { workspace = true }
regex = { workspace = true }
async-trait = { workspace = true }
futures = { workspace = true }
chrono = { workspace = true }
# The zone a usage-limit wait names its resume time in.
chrono-tz = { workspace = true }
# Only `tokio::time::sleep`, to wait out a usage limit (see `usage_limit`).
tokio = { workspace = true }

[dev-dependencies]
tokio = { workspace = true, features = ["test-util"] }
